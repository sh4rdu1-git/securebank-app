spring:
  application:
    name: securebank
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # validate: Hibernate checks that the DB schema matches entities
      # but makes NO changes. Flyway owns schema changes, not Hibernate.
      # A common beginner mistake is leaving this as 'create-drop' or 'update'
      # in production, which can silently destroy or alter your database.
    show-sql: false
      # Never true in production — logs every SQL query, overwhelming at scale
    properties:
      hibernate:
        "[format_sql]": true
        jdbc:
          "[time_zone]": UTC
          # Always store timestamps in UTC. Convert to local time in the UI.
          # This prevents an entire class of timezone-related bugs.

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  shutdown: graceful
    # Graceful shutdown: when Kubernetes sends a SIGTERM to stop the pod,
    # Spring finishes in-flight requests before shutting down.
    # Without this, requests in progress are abruptly terminated.
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    "[com.securebank]": DEBUG

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      expiration: ${APPLICATION_SECURITY_JWT_EXPIRATION:3600000}

# NOTE:
# For YAML keys wrapped inside "[]", below is the explanation:
# This key is used in a map and contains special characters. 
# It is recommended to escape it by surrounding it with '[]'